services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: isi_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: isi
      RABBITMQ_DEFAULT_PASS: isi

  postgres:
    image: postgres:16
    container_name: isi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: isi
      POSTGRES_PASSWORD: isi
      POSTGRES_DB: disposable_income
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: isi_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres

volumes:
  postgres_data:
  grafana_data: